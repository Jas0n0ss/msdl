name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'js/**'
      - 'css/**'
      - 'fonts/**'
      - 'index.html'
      - '404.html'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data/products.json against the curation policy
        run: node tools/validate-products.mjs

      - name: Validate data/chocolatey.json
        run: |
          node -e "
          const d = require('./data/chocolatey.json');
          if (!Array.isArray(d.packages) || d.packages.length < 10) throw new Error('chocolatey catalogue too small');
          if (!d.installCommand) throw new Error('missing install command');
          const ids = new Set();
          for (const p of d.packages) {
            if (ids.has(p.id)) throw new Error('duplicate id ' + p.id);
            ids.add(p.id);
            if (!/^[a-z0-9][a-z0-9._-]*$/.test(p.id)) throw new Error('bad id ' + p.id);
            if (!p.category || !p.name) throw new Error('incomplete package ' + p.id);
          }
          console.log(d.packages.length + ' chocolatey packages ok');
          "

  site:
    name: Site scripts and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the scripts
        run: |
          node --check js/msdl.js
          node --check tools/update-products.mjs
          node --check tools/validate-products.mjs
          node --check tools/check-assets.mjs

      - name: Check that every local asset exists
        run: node tools/check-assets.mjs
