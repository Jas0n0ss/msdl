name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'js/**'
      - 'css/**'
      - 'fonts/**'
      - 'index.html'
      - '404.html'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data/products.json against the curation policy
        run: node tools/validate-products.mjs

  site:
    name: Site scripts and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the scripts
        run: |
          node --check js/msdl.js
          node --check tools/update-products.mjs
          node --check tools/validate-products.mjs
          node --check tools/check-assets.mjs

      - name: Check that every local asset exists
        run: node tools/check-assets.mjs
