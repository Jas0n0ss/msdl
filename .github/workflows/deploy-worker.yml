name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy msdl-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci || npm install

      - name: Syntax-check the worker
        run: node --check worker/index.mjs

      - name: Explain what is missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Add CLOUDFLARE_API_TOKEN to deploy the worker."
          exit 0

      - name: Check the token can manage Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services/msdl-api")
          echo "workers API: HTTP $code"
          if [ "$code" = "403" ] || [ "$code" = "401" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN has no Workers access. Add Account → Workers Scripts → Edit to the token."
            exit 1
          fi

      - name: Publish to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: worker
          command: deploy
