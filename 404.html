<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>404 — not in the index · MSDL</title>
    <style>
        :root {
            color-scheme: light dark;
            --paper: #f4f4ef;
            --ink: #14161a;
            --ink-2: #3b3f46;
            --muted: #646973;
            --line: #e1e1d8;
            --accent: #0a7a56;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #08090b;
                --ink: #f1f2f3;
                --ink-2: #c7cbd0;
                --muted: #8c939b;
                --line: #1d2126;
                --accent: #4ade80;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 24px;
            background: var(--paper);
            color: var(--ink);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 520px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 22px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        h1 {
            margin: 0;
            font-size: clamp(3.2rem, 12vw, 5rem);
            font-weight: 600;
            line-height: .95;
            letter-spacing: -.05em;
        }

        h1 span {
            color: var(--accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 500;
        }

        p {
            margin: 18px 0 0;
            max-width: 42ch;
            font-size: 15px;
            line-height: 1.6;
            color: var(--ink-2);
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .9em;
            padding: 2px 5px;
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 30px;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 42px;
            padding: 0 18px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: var(--ink);
            color: var(--paper);
            font-size: 13.5px;
            font-weight: 500;
            text-decoration: none;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
        }

        a:hover {
            background: var(--accent);
        }

        a.secondary {
            background: transparent;
            border-color: var(--line);
            color: var(--ink-2);
        }

        a.secondary:hover {
            background: transparent;
            border-color: var(--muted);
            color: var(--ink);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10.5px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow"><span class="dot"></span>msdl / not found</p>
        <h1><span>404</span><br>Not in the index.</h1>
        <p>
            This address does not map to a product. Every release MSDL tracks lives at
            <code>/#&lt;product-id&gt;</code> on the main page.
        </p>
        <div class="actions">
            <a href="./">Back to the index</a>
            <a class="secondary" href="https://github.com/Jas0n0ss/msdl">Source on GitHub</a>
        </div>
        <footer>msdl · unofficial index of Microsoft software downloads</footer>
    </main>
</body>

</html>
