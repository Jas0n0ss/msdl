name = "msdl-api"
main = "index.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

[[routes]]
pattern = "api.msdl.404x.io"
custom_domain = true
